<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liber Arcanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=La+Belle+Aurore&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --ink:#43301a;
  --gold-1:#f7e2a4; --gold-2:#d9ac54; --gold-3:#7a5518;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow:hidden; background:#080a07; }
body{
  font-family:'IM Fell English', serif;
  user-select:none; -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}
body.grabbing{ cursor:grabbing; }
body.writing{ cursor:default; }

#gl{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

/* soft filmic vignette over the render, with a slow candle flicker */
#vignette{
  position:fixed; inset:0; pointer-events:none; z-index:5;
  background: radial-gradient(125% 95% at 50% 46%, transparent 52%, rgba(9,7,3,.62) 100%);
  animation: candle 6s ease-in-out infinite;
}
@keyframes candle{
  0%,100%{ opacity:1 } 23%{ opacity:.9 } 41%{ opacity:.97 } 67%{ opacity:.87 } 82%{ opacity:.96 }
}

/* ---------- the inscription overlay ----------
   sits exactly over the 3D page, transparent glyphs (the real ink is painted
   into the page's CanvasTexture) but a real caret and real text editing.      */
#writer{
  position:fixed; z-index:8;
  transform-origin: 0 0;
  font-family:'La Belle Aurore','IM Fell English',cursive;
  color:transparent;
  -webkit-text-fill-color:transparent;
  caret-color:#7d5316;
  outline:none; border:0; background:transparent;
  white-space:pre-wrap; word-break:break-word; overflow:hidden;
  user-select:text; -webkit-user-select:text;
  display:none;
  cursor:text;
}
#writer.on{ display:block; }

.ui{ position:fixed; z-index:10; }
.hint{
  bottom:22px; left:50%; transform:translateX(-50%);
  font-family:'IM Fell English', serif; font-style:italic;
  color:rgba(240,216,156,.66); font-size:15px; letter-spacing:1px;
  text-align:center; pointer-events:none; transition:opacity .8s;
  text-shadow:0 1px 4px #000, 0 0 18px rgba(0,0,0,.7);
}
.runes{ top:20px; right:22px; display:flex; gap:12px; }
.rune-btn{
  width:46px; height:46px; border-radius:50%;
  border:1px solid rgba(214,164,74,.45);
  background:radial-gradient(circle at 35% 30%, rgba(92,98,50,.55), rgba(16,16,10,.9));
  color:#f0d493; font-size:21px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-family:'IM Fell English SC',serif;
  box-shadow: 0 2px 10px rgba(0,0,0,.7), inset 0 0 12px rgba(255,206,110,.14);
  transition:.25s;
}
.rune-btn:hover{
  box-shadow: 0 2px 14px rgba(0,0,0,.8), inset 0 0 16px rgba(255,206,110,.34), 0 0 18px rgba(236,192,102,.42);
  transform:translateY(-2px);
}
.saved-note{
  bottom:60px; left:50%; transform:translateX(-50%);
  font-family:'IM Fell English SC',serif; color:rgba(242,214,146,.9);
  font-size:13px; letter-spacing:3px; opacity:0; pointer-events:none;
  transition:opacity .5s; text-shadow:0 0 10px rgba(255,200,90,.5);
}
.saved-note.show{ opacity:1; }

#loading{
  position:fixed; inset:0; z-index:20; display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:radial-gradient(120% 100% at 50% 40%, #1d2417, #070a06 75%);
  color:rgba(240,214,150,.8); font-family:'IM Fell English SC',serif;
  letter-spacing:4px; font-size:14px;
  transition:opacity 1.1s ease; pointer-events:none;
}
#loading.gone{ opacity:0; }
#loading .sig{ font-size:30px; color:rgba(232,192,105,.9); text-shadow:0 0 22px rgba(255,190,90,.5); animation:candle 3.4s ease-in-out infinite; }
#err{
  position:fixed; left:0; right:0; bottom:0; z-index:40; display:none;
  padding:10px 14px; background:rgba(60,10,10,.9); color:#ffd9c9;
  font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; max-height:40%; overflow:auto;
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<div id="writer" contenteditable="true" spellcheck="false"></div>

<div class="ui hint" id="hint">Drag the void to turn the tome &nbsp;·&nbsp; Drag the cover open &nbsp;·&nbsp; ✦ unseals it</div>
<div class="ui saved-note" id="savedNote">✒&nbsp; INSCRIBED</div>
<div class="ui runes">
  <button class="rune-btn" id="btnOpen" title="Open / Seal the tome">✦</button>
  <button class="rune-btn" id="btnReset" title="Recenter the tome">⟲</button>
</div>

<div id="loading"><div class="sig">✦</div><div>KINDLING THE TOME</div></div>
<pre id="err"></pre>

<script>
window.addEventListener('error', e=>{
  const p = document.getElementById('err');
  p.style.display='block';
  p.textContent += (e.message || e.error) + '\n' + (e.filename||'') + ':' + (e.lineno||'') + '\n';
});
window.addEventListener('unhandledrejection', e=>{
  const p = document.getElementById('err');
  p.style.display='block';
  p.textContent += 'promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n';
});
</script>
<script type="module" src="./book3d.js?v=natural-form-1"></script>
</body>
</html>
