<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liber Arcanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600;700&family=Great+Vibes&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">

</head>
<body>
<div id="intro" aria-hidden="true">
  <video muted playsinline preload="none" disablepictureinpicture disableremoteplayback></video>
  <div id="veil">
    <div class="sigil">
      <svg class="turn" viewBox="-100 -100 200 200"><circle class="ticks" r="86" pathLength="84" stroke-dasharray=".18 2.82" opacity="0"/></svg>
      <svg class="draw" viewBox="-100 -100 200 200">
        <circle class="ln" r="92" pathLength="1" transform="rotate(-90)"/>
        <circle class="ln" r="80" pathLength="1" transform="rotate(-90)"/>
        <g class="star"></g>
        <circle class="ln" r="30" pathLength="1" transform="rotate(-90)"/>
        <circle class="core" r="1.6" opacity=".35"/>
      </svg>
    </div>
    <div class="name">LIBER ARCANUM</div>
    <p id="introNote"></p>
  </div>
  <p id="tapSound">Tap for sound</p>
</div>
<script src="src/film/intro.js"></script>

<canvas id="gl"></canvas>
<div id="vignette"></div>
<textarea id="quill" spellcheck="false" autocomplete="off" autocapitalize="sentences" aria-label="Page text"></textarea>

<div class="ui toast" id="toast"></div>
<div class="ui spells shelf" id="shelf" hidden><div class="card" role="dialog" aria-label="Books"><button class="close" aria-label="Close">✕</button><div class="body"></div></div></div>
<div class="ui spells" id="spells" hidden><div class="card" role="dialog" aria-label="Shortcuts"><button class="close" aria-label="Close">✕</button><h2>SPELLS OF THE TOME</h2><p class="sub">keyboard shortcuts</p></div></div>

<div class="ui bar">
  <button class="rune" id="btnSound" title="Sound on (M)" aria-label="Forest sound" aria-pressed="true"><svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5h3.2L12 5.2v13.6l-4.8-4.3H4z" fill="currentColor"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6M17.8 6.6a7.6 7.6 0 0 1 0 10.8" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg><svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5h3.2L12 5.2v13.6l-4.8-4.3H4z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>
  <button class="rune" id="btnBook" title="Open the book (O)" aria-label="Open the book"><svg class="ico-open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 6.6C9.8 5 6.9 4.5 3.2 5v13.2c3.7-.5 6.6 0 8.8 1.6 2.2-1.6 5.1-2.1 8.8-1.6V5c-3.7-.5-6.6 0-8.8 1.6z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path d="M12 6.6v13.2" stroke="currentColor" stroke-width="1.2"/><path d="M5.6 8.6c1.8-.2 3.4.1 4.6.8M5.6 11.4c1.8-.2 3.4.1 4.6.8M18.4 8.6c-1.8-.2-3.4.1-4.6.8M18.4 11.4c-1.8-.2-3.4.1-4.6.8" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" opacity=".75"/></svg><svg class="ico-close" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="5.5" y="3.2" width="13.5" height="17.6" rx="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8.3 3.2v17.6" stroke="currentColor" stroke-width="1.2"/><circle cx="13.6" cy="10.4" r="1.7" fill="currentColor"/><path d="M13.6 6.6v1.6M13.6 12.6v1.6M10.6 10.4h1.4M15.6 10.4h1.4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg></button>
  <button class="rune" id="btnWrite" title="Lay the book open and write" aria-label="Lay the book open and write"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20.5 2.5c-6 1-11 5.5-13.2 12.3l-1.6 4.9 1.4.5 1.2-3.3c3.6-.4 6.6-2.3 8.4-5.3-1.4.3-2.7.2-3.9-.2 2.6-.6 4.6-2.1 5.9-4.3-1 .1-1.9 0-2.8-.3 2-.9 3.6-2.4 4.6-4.3z" fill="currentColor"/><path d="M4.2 21.5c1.8-.4 3.5-.2 5 .4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg></button>
  <button class="rune" id="btnMore" title="More" aria-label="More actions" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor"/></svg></button>
</div>

<div class="ui menu" id="menu" role="menu" hidden>
  <div class="view" data-view="main">
    <button role="menuitem" data-act="share" class="two" hidden>Share<span>Send the book to a friend</span></button>
    <button role="menuitem" data-act="erase" hidden>Erase this page</button>
    <button role="menuitem" data-act="erase2" hidden>Erase this page</button>
    <button role="menuitem" data-act="restore" hidden>Undo erase</button>
    <button role="menuitem" data-act="history" hidden>Page history</button>
    <button role="menuitem" data-act="files" class="two more">Files<span>Download or restore the book</span></button>
    <button role="menuitem" data-act="replay">Intro</button>
    <button role="menuitem" data-act="spells" class="fine">Shortcuts</button>
    <div class="menu-alert" hidden><hr><p class="menu-note"></p></div>
  </div>
  <div class="view" data-view="files" hidden>
    <button role="menuitem" data-act="main" class="back">Files</button>
    <button role="menuitem" data-act="exportText" class="two">Download as text<span>To read or print anywhere</span></button>
    <button role="menuitem" data-act="saveCopy" class="two">Download a backup<span>Everything, to restore later</span></button>
    <button role="menuitem" data-act="openCopy" class="two">Restore a backup<span>Replaces your private book</span></button>
    <hr>
    <p class="menu-note">Saves automatically</p>
    <p class="menu-mark">© 2026 fedorova.studio · <a href="privacy.html">Privacy</a></p>
  </div>
</div>

<nav class="ui pager" id="pager" aria-label="Pages" hidden>
  <i class="fillet under"></i><i class="fillet line"></i>
  <button id="btnPrev" title="Previous page (←)" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4C12.6 7.8 10 10.4 7 12c3 1.6 5.6 4.2 8.5 8-1.6-3.6-3-6.1-4.6-8 1.6-1.9 3-4.4 4.6-8z"/></svg></button>
  <label class="pageno" id="pageNo" title="Type a page number (G)"><input id="pageIn" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off" spellcheck="false" placeholder="page" aria-label="Page number, type one and press Go"><span>of 100</span></label>
  <button id="btnNext" title="Next page (→)" aria-label="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4c2.9 3.8 5.5 6.4 8.5 8-3 1.6-5.6 4.2-8.5 8 1.6-3.6 3-6.1 4.6-8-1.6-1.9-3-4.4-4.6-8z"/></svg></button>
</nav>
