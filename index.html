<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liber Arcanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600;700&family=Great+Vibes&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --gold:#f0d493;
  --gold-dim:rgba(240,214,150,.66);
  --gold-line:rgba(214,164,74,.45);
  --night:#080a07;
  --ui-font:'Cormorant SC','Cormorant Garamond',serif;
  --text-font:'Cormorant Garamond',serif;
  --gilt:linear-gradient(180deg, #f3d995, #a8782f 55%, #e2bd72);
  --gilt-gap:#14160d;
  --gilt-fillet:rgba(236,196,110,.7);
  --face:radial-gradient(120% 140% at 50% 0%, #2f3419, #11130b 70%);
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow:hidden; background:var(--night); }
body{
  font-family:var(--text-font);
  user-select:none; -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}
body.grabbing{ cursor:grabbing; }
body.cur-turn{ cursor:grab; }
body.cur-text{ cursor:text; }
body.cur-pointer{ cursor:pointer; }

#gl{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

#vignette{
  position:fixed; inset:0; pointer-events:none; z-index:5;
  background: radial-gradient(125% 95% at 50% 46%, transparent 58%, rgba(9,7,3,.36) 100%);
  animation: candle 6s ease-in-out infinite;
}
@keyframes candle{
  0%,100%{ opacity:1 } 23%{ opacity:.9 } 41%{ opacity:.97 } 67%{ opacity:.87 } 82%{ opacity:.96 }
}

/* the real keyboard target: the ink itself is painted into the page texture */
#quill{
  position:fixed; left:0; bottom:0; z-index:0;
  width:2400px; height:24px;
  opacity:0; pointer-events:none;
  font-size:16px; line-height:24px;
  border:0; outline:none; resize:none; overflow:hidden;
  white-space:pre; background:transparent; color:transparent; caret-color:transparent;
}

.ui{ position:fixed; z-index:10; }
.bar{ top:18px; right:18px; display:flex; gap:10px; }
.rune{
  width:44px; height:44px; border-radius:50%;
  border:1.5px solid transparent;
  background:var(--face) padding-box, var(--gilt) border-box;
  color:#e6c47a; font-size:20px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-family:var(--ui-font);
  box-shadow:inset 0 0 0 2.5px var(--gilt-gap), inset 0 0 0 3.5px var(--gilt-fillet), 0 4px 12px rgba(0,0,0,.6);
  transition:color .25s, box-shadow .25s, opacity .25s;
}
.rune svg{ transition:filter .25s; }
.rune:hover, .rune:focus-visible{ color:#ffe6ae; outline:none; }
.rune:hover svg, .rune:focus-visible svg{ filter:drop-shadow(0 0 6px rgba(255,200,110,.8)); }
.rune.on{
  color:#ffe6ae;
  box-shadow:inset 0 0 0 2.5px var(--gilt-gap), inset 0 0 0 3.5px var(--gilt-fillet), inset 0 0 16px rgba(255,206,110,.4), 0 0 16px rgba(236,192,102,.5), 0 4px 12px rgba(0,0,0,.6);
}
.rune[disabled]{ opacity:.35; pointer-events:none; }
.rune[hidden]{ display:none; }
#btnSound .ico-off, #btnSound.muted .ico-on{ display:none; }
#btnSound.muted .ico-off{ display:block; }
#btnSound.muted{ opacity:.62; }
#btnBook .ico-close, #btnBook.open .ico-open{ display:none; }
#btnBook.open .ico-close{ display:block; }

/* pagination: a gilt label like the ones on an old spine, rounded ends and a double fillet */
.pager{
  bottom:18px; left:50%; transform:translateX(-50%);
  height:58px; padding:0 6px;
  display:flex; align-items:center;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));
  animation:fadein .4s ease-out;
}
.pager[hidden]{ display:none; }
.pager{ transition:opacity .4s; }
body.quill-up .pager:not(:hover):not(:focus-within){ opacity:.4; }
.pager::before, .pager::after, .pager .fillet{
  content:''; position:absolute; z-index:0; pointer-events:none; border-radius:999px;
}
.pager::before{ inset:0; background:var(--gilt); }
.pager .fillet.under{ inset:1.5px; background:linear-gradient(180deg, #262a17, #0f110a); }
.pager .fillet.line{ inset:4px; background:linear-gradient(180deg, rgba(236,196,110,.75), rgba(170,120,50,.6)); }
.pager::after{ inset:5px; background:var(--face); }
.pager > button, .pageno{ position:relative; z-index:1; }
.pager > button{
  width:48px; height:48px; flex-shrink:0; padding:0; border:0; background:transparent;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:#e6c47a; transition:color .25s, opacity .25s;
}
.pager > button svg{ width:24px; height:24px; fill:currentColor; transition:transform .25s, filter .25s; }
.pager > button:hover, .pager > button:focus-visible{ color:#ffe6ae; outline:none; }
.pager > button:hover svg, .pager > button:focus-visible svg{ filter:drop-shadow(0 0 6px rgba(255,200,110,.8)); }
#btnPrev:hover svg, #btnPrev:focus-visible svg{ transform:translateX(-2px); }
#btnNext:hover svg, #btnNext:focus-visible svg{ transform:translateX(2px); }
.pager > button[disabled]{ opacity:.3; pointer-events:none; }
.pageno{
  min-width:120px; display:flex; flex-direction:column; align-items:center; gap:1px;
  font:600 10px var(--ui-font); letter-spacing:3px; color:var(--gold-dim); white-space:nowrap;
  text-shadow:0 1px 3px #000; cursor:text;
}
.pageno input{
  width:5ch; height:26px; padding:0; border:0; border-bottom:1px solid transparent; border-radius:0; background:transparent;
  color:#ffe6ae; font:italic 600 24px/1 var(--text-font); letter-spacing:0; text-align:center;
  text-shadow:0 0 10px rgba(255,200,110,.3), 0 1px 3px #000;
  outline:none; caret-color:var(--gold); user-select:text; -webkit-user-select:text;
  transition:border-color .25s, text-shadow .25s;
}
.pageno:hover input{ text-shadow:0 0 14px rgba(255,200,110,.6), 0 1px 3px #000; }
.pageno input:focus{ border-bottom-color:rgba(240,212,147,.7); text-shadow:0 0 14px rgba(255,200,110,.6), 0 1px 3px #000; }
.pageno input::placeholder{ color:rgba(240,214,150,.35); font-size:18px; }

.toast{
  bottom:84px; left:50%; transform:translateX(-50%);
  font-family:var(--ui-font); font-weight:600; color:rgba(242,214,146,.95);
  font-size:14px; letter-spacing:3px; opacity:0; pointer-events:none;
  transition:opacity .5s; text-shadow:0 0 10px rgba(255,200,90,.5), 0 1px 3px #000;
  white-space:nowrap;
}
.toast.show{ opacity:1; }

/* the opening film plays over the page while the forest loads; the live book takes
   over from its last frame (grimoire.js takeOver). Its first frame stands in at once */
#intro{
  position:fixed; inset:0; z-index:35; background:var(--night);
  transition:opacity .9s ease; cursor:default;
}
#intro.gone{ opacity:0; pointer-events:none; }
#intro img, #intro video{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity .8s ease;
}
#intro.lit img, #intro.play video{ opacity:1; }
#intro.contain{ background:radial-gradient(120% 60% at 50% 50%, #18200f, var(--night) 70%); }
#intro.contain img, #intro.contain video{ object-fit:contain; }
#intro .sig{
  position:absolute; left:50%; bottom:calc(30px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  font-size:24px; color:rgba(232,192,105,.9); text-shadow:0 0 22px rgba(255,190,90,.55);
  display:none; animation:candle 3.4s ease-in-out infinite;
}
#intro.wait .sig{ display:block; }
#intro .prog{
  position:absolute; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); width:120px; height:2px; margin-left:-60px;
  border-radius:1px; overflow:hidden; background:rgba(232,192,105,.2); opacity:0; transition:opacity .6s ease;
}
#intro .prog i{
  position:absolute; inset:0; background:linear-gradient(90deg, rgba(232,192,105,.4), rgba(255,226,160,.95));
  box-shadow:0 0 8px rgba(255,200,110,.6); transform:scaleX(.04); transform-origin:0 50%; transition:transform .6s ease;
}
#intro.wait .prog{ opacity:1; }
#introNote{
  position:absolute; left:0; right:0; bottom:calc(70px + env(safe-area-inset-bottom)); text-align:center;
  color:rgba(240,214,150,.85); font:600 14px var(--ui-font); letter-spacing:4px; text-shadow:0 1px 4px #000;
}
.film .ui, .film #intro{ display:none !important; }
.film #vignette{ animation:none; opacity:.94; }
#err{
  position:fixed; left:0; right:0; bottom:0; z-index:40; display:none;
  padding:10px 14px; background:rgba(60,10,10,.9); color:#ffd9c9;
  font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; max-height:40%; overflow:auto;
}

.pageno.seeking input{ color:#ffe2a6; text-shadow:0 0 12px rgba(255,200,110,.85); animation:candle 1.2s ease-in-out infinite; }

/* the menu behind the three dots: actions that otherwise live on keys */
.menu{
  top:72px; right:18px; min-width:230px; padding:8px;
  display:flex; flex-direction:column; gap:2px;
  border-radius:18px; border:1.5px solid transparent;
  background:var(--face) padding-box, var(--gilt) border-box;
  box-shadow:inset 0 0 0 2.5px var(--gilt-gap), inset 0 0 0 3.5px var(--gilt-fillet), 0 10px 30px rgba(0,0,0,.65);
  animation:fadein .2s ease-out;
}
.menu[hidden]{ display:none; }
.menu button{
  height:46px; padding:0 16px; border:0; border-radius:11px; background:transparent; text-align:left;
  color:rgba(240,226,192,.92); font:500 18px var(--text-font); cursor:pointer;
}
.menu button:hover, .menu button:focus-visible{ background:rgba(255,210,120,.1); color:#ffe6ae; outline:none; }
.menu button[disabled]{ opacity:.35; pointer-events:none; }
.menu hr{ margin:4px 10px; border:0; border-top:1px solid var(--gold-line); opacity:.6; }
.menu .view{ display:flex; flex-direction:column; gap:2px; }
.menu .two{ display:flex; flex-direction:column; justify-content:center; gap:1px; height:56px; }
.menu .two span{ max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-style:italic; font-size:14px; color:var(--gold-dim); }
.menu .more{ position:relative; padding-right:36px; }
.menu .more::after, .menu .back::before{
  content:''; position:absolute; top:50%; width:7px; height:7px; margin-top:-4px;
  border:solid currentColor; border-width:1.5px 1.5px 0 0; opacity:.6;
}
.menu .more::after{ right:18px; transform:rotate(45deg); }
.menu .back{ position:relative; padding-left:38px; color:var(--gold-dim); font-style:italic; }
.menu .back::before{ left:18px; transform:rotate(-135deg); }
.menu [hidden]{ display:none; }
.menu-note{ max-width:240px; margin:4px 16px 6px; color:var(--gold-dim); font:italic 500 14px var(--text-font); }
@media (pointer:coarse){ .menu .fine{ display:none; } }

@keyframes rise{ from{ opacity:0; transform:translate(-50%, 6px); } to{ opacity:1; transform:translate(-50%, 0); } }

/* the list of spells */
.spells{
  inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:16px;
  background:rgba(5,7,4,.5); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  animation:fadein .35s ease-out;
}
.spells[hidden]{ display:none; }
.spells .card{
  position:relative; width:min(560px, 100%); max-height:calc(100vh - 32px); overflow:auto;
  padding:24px 28px 20px; border-radius:18px; border:1.5px solid transparent;
  background:var(--face) padding-box, var(--gilt) border-box;
  box-shadow:inset 0 0 0 2.5px var(--gilt-gap), inset 0 0 0 3.5px var(--gilt-fillet), 0 10px 40px rgba(0,0,0,.7);
  color:rgba(240,226,192,.92); font-size:17px;
}
.spells h2{ font-family:var(--ui-font); font-weight:700; letter-spacing:5px; color:var(--gold); font-size:17px; text-align:center; text-shadow:0 0 14px rgba(255,190,90,.35); }
.spells .sub{ text-align:center; font-style:italic; color:var(--gold-dim); font-size:15px; margin:2px 0 6px; }
.spells h3{ font-family:var(--ui-font); font-weight:600; letter-spacing:3px; color:var(--gold-dim); font-size:13px; margin:16px 0 4px; text-transform:uppercase; }
.spells .row{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:5px 0; border-bottom:1px dashed rgba(214,164,74,.16); }
.spells .keys{ display:flex; gap:6px; flex-shrink:0; }
.spells kbd{
  font-family:var(--ui-font); font-weight:600; font-size:13px; letter-spacing:1px; color:#ffe2a6;
  padding:2px 9px; border:1px solid var(--gold-line); border-radius:7px; background:rgba(255,210,120,.06); white-space:nowrap;
}
.spells .foot{ margin-top:14px; text-align:center; font-style:italic; color:var(--gold-dim); font-size:15px; }
.spells .close{
  position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%;
  border:1px solid var(--gold-line); background:transparent; color:#e6c47a; font-size:16px; cursor:pointer;
  transition:color .25s, box-shadow .25s;
}
.spells .close:hover{ color:#ffe6ae; box-shadow:0 0 12px rgba(236,192,102,.4); }
/* the shelf of books: one's own and the shared ones */
.shelf .card{ width:min(440px, 100%); }
.shelf h2{ padding:0 34px; }
.shelf .list{ display:flex; flex-direction:column; gap:6px; margin:16px 0 12px; }
.shelf .book{
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:56px;
  padding:8px 16px; border-radius:12px; border:1px solid rgba(214,164,74,.18); background:rgba(255,210,120,.04);
  color:inherit; font:500 18px var(--text-font); text-align:left; cursor:pointer;
}
.shelf .book small{ display:block; margin-top:1px; font-style:italic; font-size:14px; color:var(--gold-dim); }
.shelf .book.on{ border-color:var(--gold-line); background:rgba(255,210,120,.09); }
.shelf .book:hover, .shelf .book:focus-visible{ background:rgba(255,210,120,.1); outline:none; }
.shelf .tick{ color:var(--gold); font-size:18px; }
.shelf .acts{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.shelf .btn{
  min-height:46px; padding:6px 18px; border-radius:23px; border:1px solid var(--gold-line); background:transparent;
  color:#ffe6ae; font:600 17px var(--text-font); cursor:pointer;
}
.shelf .btn.main{ background:rgba(214,164,74,.22); }
.shelf .btn:hover, .shelf .btn:focus-visible{ box-shadow:0 0 12px rgba(236,192,102,.35); outline:none; }
.shelf .btn[disabled]{ opacity:.5; pointer-events:none; }
.shelf .btn.minor{ min-height:36px; border:0; color:var(--gold-dim); font:italic 500 15px var(--text-font); text-decoration:underline; }
.shelf .btn.minor:hover, .shelf .btn.minor:focus-visible{ box-shadow:none; color:var(--gold); }
.shelf input[type=text]{
  width:100%; height:48px; margin-top:14px; padding:0 14px; border-radius:12px; border:1px solid var(--gold-line);
  background:rgba(0,0,0,.25); color:#ffe6ae; font:500 18px var(--text-font); outline:none;
}
.shelf input[type=text]::placeholder{ color:rgba(240,226,192,.4); }
.shelf input[type=text]:focus{ box-shadow:0 0 12px rgba(236,192,102,.3); }
.shelf .link{
  margin:14px 0 4px; padding:10px 12px; border-radius:10px; border:1px dashed var(--gold-line);
  font-size:13px; color:var(--gold-dim); word-break:break-all; user-select:all; -webkit-user-select:all;
}
.shelf .who{ margin-top:16px; text-align:center; font-style:italic; color:var(--gold-dim); font-size:15px; }
.shelf .keepers{ margin:4px 0 8px; font-size:17px; }
.shelf .keepers .row{ display:flex; align-items:center; gap:4px; padding:4px 0; border-bottom:1px dashed rgba(214,164,74,.16); }
.shelf .keepers .row:last-child{ border-bottom:0; }
.shelf .keepers .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shelf .keepers .name small{ margin-left:8px; font-style:italic; font-size:14px; color:var(--gold-dim); }
.shelf .keepers button{ flex:none; font-size:15px; }
.shelf .body[data-mode=ask] h2:empty{ display:none; }
.shelf .who button, .shelf .keepers button{ border:0; background:none; padding:4px; color:var(--gold); font:inherit; text-decoration:underline; cursor:pointer; }
/* the invitation: a card on a leaf of the book, sealed in wax, written in brown ink */
.shelf.locked .close{ display:none; }
.shelf .hint{ margin:6px 0 0; text-align:center; font-style:italic; color:var(--gold-dim); font-size:14px; }
.shelf.invite{ --ink:#3b2612; --ink-soft:#6b4b2a; --ink-rule:rgba(59,38,18,.5); }
.shelf.invite .card{
  width:min(470px, 100%); padding:30px 58px 64px; border:0; border-radius:2px;
  background:#e6d2a6 center/100% 100% no-repeat; color:var(--ink);
  box-shadow:0 26px 70px rgba(0,0,0,.7), 0 3px 8px rgba(0,0,0,.45);
  animation:invite .8s cubic-bezier(.2,.7,.2,1);
}
@keyframes invite{ from{ opacity:0; transform:translateY(18px) rotate(-1.2deg) scale(.97); } to{ opacity:1; transform:none; } }
.shelf.invite .seal{ width:74px; height:74px; margin:0 auto 6px; filter:drop-shadow(0 3px 3px rgba(40,10,4,.45)); }
.shelf.invite .seal svg{ display:block; width:100%; height:100%; }
.shelf.invite .body[data-mode=vow]{ padding-top:24px; }
.shelf.invite h2{ padding:0; color:var(--ink-soft); font-size:14px; letter-spacing:6px; text-shadow:none; }
.shelf.invite h2::after{
  content:''; display:block; width:150px; height:10px; margin:8px auto 0;
  background:radial-gradient(circle, var(--ink-soft) 0 2px, transparent 2.5px) center/10px 10px no-repeat,
    linear-gradient(90deg, transparent, var(--ink-rule) 30%, transparent 45%, transparent 55%, var(--ink-rule) 70%, transparent) center/100% 1px no-repeat;
}
.shelf.invite .script{ margin:14px 0 2px; text-align:center; font:400 46px/1.15 'Great Vibes', cursive; color:var(--ink); }
.shelf.invite .line{ text-align:center; font-style:italic; font-size:18px; color:var(--ink-soft); }
.shelf.invite .title{ margin:4px 0 6px; text-align:center; font:700 23px/1.2 var(--ui-font); letter-spacing:2px; color:var(--ink); }
.shelf.invite .orn{ width:120px; height:14px; margin:16px auto 14px; background:
  radial-gradient(circle, var(--ink-soft) 0 1.6px, transparent 2px) 0 50%/40px 14px repeat-x; opacity:.75; }
.shelf.invite .rules{ list-style:none; display:flex; flex-direction:column; gap:7px; width:max-content; max-width:100%; margin:0 auto; padding:0; }
.shelf.invite .rules li{ display:flex; align-items:baseline; gap:12px; font-size:19px; }
.shelf.invite .rules b{ flex:0 0 26px; text-align:right; font:600 15px var(--ui-font); letter-spacing:1px; color:var(--ink-soft); }
.shelf.invite .note{ margin:10px 0 0; text-align:center; font-style:italic; font-size:15px; color:var(--ink-soft); }
.shelf.invite .vow{ margin:16px 0 0; text-align:center; font:italic 500 20px/1.5 var(--text-font); color:var(--ink); }
.shelf.invite .vow .amen{ margin-top:10px; font:700 15px var(--ui-font); letter-spacing:6px; color:var(--ink-soft); }
.shelf.invite .sign{ margin-top:22px; text-align:center; }
.shelf.invite .sign input[type=text], .shelf.invite .sign .name{
  display:block; width:80%; height:auto; margin:0 auto; padding:0 0 2px; border:0; border-bottom:1px solid var(--ink-rule); border-radius:0;
  background:transparent; box-shadow:none; text-align:center; font:400 40px/1.25 'Great Vibes', cursive; color:#2a1808; caret-color:var(--ink);
}
.shelf.invite .sign input[type=text]:focus{ border-bottom-color:var(--ink); }
.shelf.invite .sign input[type=text]::placeholder{ color:rgba(59,38,18,.3); }
.shelf.invite .sign .cap{ margin-top:6px; font:600 11px var(--ui-font); letter-spacing:2.5px; text-transform:uppercase; color:var(--ink-soft); }
.shelf.invite .acts{ margin-top:22px; align-items:center; }
.shelf.invite .btn.main{ min-width:min(240px, 100%); padding:0 30px; }
.shelf.invite .btn.main{ border:1px solid #2a180a; background:#4b2d15; color:#f4e4bf; font-size:18px; letter-spacing:1px; box-shadow:inset 0 1px 0 rgba(255,224,170,.18); }
.shelf.invite .btn.main:hover, .shelf.invite .btn.main:focus-visible{ background:#5c3819; box-shadow:0 4px 14px rgba(59,38,18,.35); }
.shelf.invite .btn.minor{ color:var(--ink-soft); }
.shelf.invite .btn.minor:hover, .shelf.invite .btn.minor:focus-visible{ color:var(--ink); }
@media (prefers-reduced-motion:reduce){ .shelf.invite .card{ animation:none; } }
@media (max-width:420px){
  .shelf.invite .card{ padding:24px 34px 48px; }
  .shelf.invite .script{ font-size:38px; }
  .shelf.invite .vow{ font-size:17px; }
  .shelf.invite .rules li{ font-size:17px; }
}

<body>
<div id="intro" aria-hidden="true">
  <img alt="">
  <video muted playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
  <div class="sig">✦</div>
  <div class="prog"><i></i></div>
  <p id="introNote"></p>
</div>
<script>
/* the opening film: the book on its rock wakes and opens. It starts at once, and the
   live book (grimoire.js) takes over when both the film and the forest are done.
   A tap or a key once the forest is in skips the rest.
   On a slow line: the film watches its own download. If it comes in slower than it
   plays, a lighter cut takes over from the same moment (loaded in a second player, so
   nothing flickers); if even that cannot keep up, the film fades back to its first frame and
   leaves the line to the book. A still that takes over 3 s means no film at all: the
   still stands and the book opens itself when it is in. Whenever there is only a wait
   to see, a spark and a thread of gold show the book is still coming */
(()=>{
  const box = document.getElementById('intro');
  if(/[?&]film\b/.test(location.search)){ document.documentElement.classList.add('film'); box.remove(); return; }
  const still = box.querySelector('img'), bar = box.querySelector('.prog i');
  let v = box.querySelector('video');
  /* the cuts there are; a tall screen without its own cut sees the wide one whole */
  const CUTS = ['wide', 'tall'], tall = innerWidth/innerHeight < 0.9;
  const kind = tall && CUTS.includes('tall') ? 'tall' : 'wide', fit = tall && kind === 'wide' ? 'contain' : 'cover';
  const src = 'assets/intro/' + kind;
  const I = window.__intro = { kind, fit, take: null, played: false, failed: false, skip: false, gone: false, cut: null };
  box.classList.add(fit);
  const OPENED = 7.3;
  /* what the book itself downloads, roughly, on this kind of device (for the thread of gold) */
  const EXPECT = matchMedia('(pointer: coarse)').matches ? 35e6 : 54e6;
  let graceTm = 0, lastT = -1, lastMove = 0, buffering = false, resting = 0;
  const ended = ()=> v.ended || resting > 0;
  const at = ()=> v.currentTime;
  const finish = mode=>{
    if(I.gone) return;
    I.gone = true;
    clearTimeout(graceTm);
    I.take(mode);
    box.classList.add('gone');
    setTimeout(()=>{ v.removeAttribute('src'); v.load(); box.remove(); }, 1000);
  };
  const check = ()=>{
    if(I.gone) return;
    box.classList.toggle('wait', !I.take && (ended() || I.failed || I.skip || buffering));
    if(!I.take) return;
    if(ended() || I.skip) return finish(I.played && !resting && (v.ended || at() > OPENED) ? 'open' : 'closed');
    if(I.failed) return finish('closed');
    if(!I.played && !graceTm) graceTm = setTimeout(()=>{ if(!I.played){ v.pause(); finish('closed'); } }, 1500);
  };
  I.ready = take=>{ I.take = take; check(); };
  /* the thread of gold: the book's files that have arrived, against what it needs */
  setInterval(()=>{
    if(I.gone || !box.classList.contains('wait')) return;
    let got = 0;
    for(const e of performance.getEntriesByType('resource')) if(!/assets\/intro\//.test(e.name)) got += e.encodedBodySize || e.transferSize || 0;
    bar.style.transform = `scaleX(${Math.min(0.96, 0.04 + got/EXPECT)})`;
  }, 400);
  const bind = el=>{
    el.addEventListener('playing', ()=>{ if(el !== v) return; I.played = true; buffering = false; box.classList.add('play'); check(); });
    el.addEventListener('waiting', ()=>{ if(el !== v) return; buffering = true; setTimeout(check, 700); });
    el.addEventListener('ended', ()=>{ if(el === v) check(); });
    el.addEventListener('error', ()=>{ if(el !== v || I.gone) return; I.failed = true; check(); });
    el.addEventListener('timeupdate', ()=>{ if(el !== v) return; if(v.currentTime !== lastT){ lastT = v.currentTime; lastMove = performance.now(); if(buffering){ buffering = false; check(); } } });
  };
  /* how many seconds of film arrive per second of wall clock */
  let since = 0;
  let from = 0;
  const pace = ()=>{ const b = v.buffered, got = b.length ? b.end(b.length - 1) - from : 0; return got/Math.max(0.5, (performance.now() - since)/1000); };
  const play = el=>{ const p = el.play(); if(p && p.catch) p.catch(()=>{ if(el === v && !I.played){ I.failed = true; check(); } }); };
  const start = cut=>{
    I.cut = cut;
    if(cut === null){ I.failed = true; check(); return; }
    bind(v);
    v.src = src + cut + '.mp4';
    since = performance.now();
    play(v);
    const watch = setInterval(()=>{
      if(I.gone || ended()){ clearInterval(watch); return; }
      const el = (performance.now() - since)/1000, r = pace(), full = v.buffered.length && v.buffered.end(v.buffered.length - 1) >= v.duration - 0.1;
      if(full){ clearInterval(watch); return; }
      if(I.cut === '' && el > 2 && r < 1.4) lighter();
      else if(I.cut === '_lite' && v.dataset.lite && el > 2.5 && r < 0.9 && !I.take){ rest(); clearInterval(watch); }
    }, 250);
  };
  /* the film fades back to its first frame, the one the book will open from, and
     stops loading */
  const rest = ()=>{
    v.pause();
    resting = Math.max(0.01, v.currentTime);
    box.classList.remove('play');
    const el = v;
    setTimeout(()=>{ el.removeAttribute('src'); el.load(); }, 900);
    check();
  };
  /* the lighter cut in a second player, shown once it plays from where the first one is */
  const lighter = ()=>{
    I.cut = '_lite';
    const old = v, nv = old.cloneNode();
    nv.removeAttribute('src');
    nv.style.opacity = '0';
    box.insertBefore(nv, old.nextSibling);
    bind(nv);
    nv.src = src + '_lite.mp4';
    nv.addEventListener('loadedmetadata', ()=>{ nv.currentTime = Math.min(nv.duration - 0.1, old.currentTime + 0.4); play(nv); }, { once: true });
    nv.addEventListener('playing', ()=>{
      if(v !== old) return;
      v = nv; nv.dataset.lite = '1'; since = performance.now(); from = nv.currentTime;
      nv.style.opacity = '';
      old.pause(); old.removeAttribute('src'); old.load(); old.remove();
    }, { once: true });
  };
  let decided = false;
  const decide = slow=>{ if(decided) return; decided = true; start(slow || matchMedia('(prefers-reduced-motion: reduce)').matches || (navigator.connection && navigator.connection.saveData) ? null : ''); };
  still.onload = ()=>{ box.classList.add('lit'); decide(false); };
  still.onerror = ()=>decide(true);
  /* a still that takes this long is a connection too slow for any film */
  setTimeout(()=>decide(true), 3000);
  still.src = src + '.jpg';
  setInterval(()=>{
    if(I.take && I.played && !I.gone && !ended() && performance.now() - lastMove > 3000)
      finish(at() > OPENED ? 'open' : 'closed');
  }, 500);
  const skip = ()=>{
    if(I.gone) return;
    if(I.take){ I.skip = true; check(); }
    else if(I.played && v.duration){ v.currentTime = Math.max(0, v.duration - 0.05); }
  };
  box.addEventListener('pointerdown', skip);
  addEventListener('keydown', e=>{ if(!I.gone && !e.metaKey && !e.ctrlKey){ e.stopPropagation(); skip(); } }, true);
})();
</script>

});

  const p = document.getElementById('err');
  p.style.display = 'block';
  p.textContent += 'Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n';
});
</script>
