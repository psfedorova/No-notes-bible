<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liber Arcanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600;700&family=Great+Vibes&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --gold:#f0d493;
  --gold-dim:rgba(240,214,150,.66);
  --gold-line:rgba(214,164,74,.45);
  --night:#080a07;
  --ui-font:'Cormorant SC','Cormorant Garamond',serif;
  --text-font:'Cormorant Garamond',serif;
  --gilt:linear-gradient(180deg, #f3d995, #a8782f 55%, #e2bd72);
  --face:radial-gradient(120% 140% at 50% 0%, #2f3419, #11130b 70%);
  /* the controls: one gilt hairline over a dark face the scene shows faintly through */
  --face-lite:radial-gradient(120% 140% at 50% 0%, rgba(30,34,18,.66), rgba(9,11,6,.6) 70%);
  --hairline:rgba(226,189,114,.78);
  --lift:0 6px 18px rgba(0,0,0,.45);
}
*{ margin:0; padding:0; box-sizing:border-box; }
/* a tap shows the control's own response, not the browser's grey flash */
html{ -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; background:var(--night); }
body{
  font-family:var(--text-font);
  user-select:none; -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}
body.grabbing{ cursor:grabbing; }
body.cur-turn{ cursor:grab; }
body.cur-text{ cursor:text; }
body.cur-pointer{ cursor:pointer; }

#gl{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

#vignette{
  position:fixed; inset:0; pointer-events:none; z-index:5;
  background: radial-gradient(125% 95% at 50% 46%, transparent 58%, rgba(9,7,3,.36) 100%);
  animation: candle 6s ease-in-out infinite;
}
@keyframes candle{
  0%,100%{ opacity:1 } 23%{ opacity:.9 } 41%{ opacity:.97 } 67%{ opacity:.87 } 82%{ opacity:.96 }
}

/* the real keyboard target: the ink itself is painted into the page texture */
#quill{
  position:fixed; left:0; bottom:0; z-index:0;
  width:2400px; height:24px;
  opacity:0; pointer-events:none;
  font-size:16px; line-height:24px;
  border:0; outline:none; resize:none; overflow:hidden;
  white-space:pre; background:transparent; color:transparent; caret-color:transparent;
}

.ui{ position:fixed; z-index:10; }
.bar{ top:18px; right:18px; display:flex; gap:10px; }
.rune{
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--hairline);
  background:var(--face-lite);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  color:#e6c47a; font-size:20px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-family:var(--ui-font);
  box-shadow:var(--lift);
  transition:color .25s, box-shadow .25s, opacity .25s;
}
.rune svg{ transition:filter .25s; }
.rune:hover, .rune:focus-visible{ color:#ffe6ae; outline:none; box-shadow:0 0 14px rgba(236,192,102,.3), var(--lift); }
.rune:hover svg, .rune:focus-visible svg{ filter:drop-shadow(0 0 6px rgba(255,200,110,.8)); }
.rune.on{
  color:#ffe6ae;
  box-shadow:inset 0 0 14px rgba(255,206,110,.35), 0 0 16px rgba(236,192,102,.45), var(--lift);
}
.rune[disabled]{ opacity:.35; pointer-events:none; }
.rune[hidden]{ display:none; }
#btnSound .ico-off, #btnSound.muted .ico-on{ display:none; }
#btnSound.muted .ico-off{ display:block; }
#btnSound.muted{ opacity:.62; }
#btnBook .ico-close, #btnBook.open .ico-open{ display:none; }
#btnBook.open .ico-close{ display:block; }

/* pagination: a gilt label like the ones on an old spine, rounded ends and one hairline */
.pager{
  bottom:18px; left:50%; transform:translateX(-50%);
  height:58px; padding:0 6px;
  display:flex; align-items:center;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));
  animation:fadein .4s ease-out;
}
.pager[hidden]{ display:none; }
/* the buttons come once the book has settled after the opening */
.bar{ transition:opacity .5s; }
.settling .bar, .settling .pager{ opacity:0; pointer-events:none; }
.pager{ transition:opacity .4s; }
body.quill-up .pager:not(:hover):not(:focus-within){ opacity:.4; }
.pager::after, .pager .fillet{
  content:''; position:absolute; z-index:0; pointer-events:none; border-radius:999px;
}
.pager .fillet{ display:none; }
.pager::after{ inset:0; border:1px solid var(--hairline); background:var(--face-lite); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.pager > button, .pageno{ position:relative; z-index:1; }
.pager > button{
  width:48px; height:48px; flex-shrink:0; padding:0; border:0; background:transparent;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:#e6c47a; transition:color .25s, opacity .25s;
}
.pager > button svg{ width:24px; height:24px; fill:currentColor; transition:transform .25s, filter .25s; }
.pager > button:hover, .pager > button:focus-visible{ color:#ffe6ae; outline:none; }
.pager > button:hover svg, .pager > button:focus-visible svg{ filter:drop-shadow(0 0 6px rgba(255,200,110,.8)); }
#btnPrev:hover svg, #btnPrev:focus-visible svg{ transform:translateX(-2px); }
#btnNext:hover svg, #btnNext:focus-visible svg{ transform:translateX(2px); }
.pager > button[disabled]{ opacity:.3; pointer-events:none; }
.pageno{
  min-width:120px; display:flex; flex-direction:column; align-items:center; gap:1px;
  font:600 10px var(--ui-font); letter-spacing:3px; color:var(--gold-dim); white-space:nowrap;
  text-shadow:0 1px 3px #000; cursor:text;
}
.pageno input{
  width:5ch; height:26px; padding:0; border:0; border-bottom:1px solid transparent; border-radius:0; background:transparent;
  color:#ffe6ae; font:italic 600 24px/1 var(--text-font); letter-spacing:0; text-align:center;
  text-shadow:0 0 10px rgba(255,200,110,.3), 0 1px 3px #000;
  outline:none; caret-color:var(--gold); user-select:text; -webkit-user-select:text;
  transition:border-color .25s, text-shadow .25s;
}
.pageno:hover input{ text-shadow:0 0 14px rgba(255,200,110,.6), 0 1px 3px #000; }
.pageno input:focus{ border-bottom-color:rgba(240,212,147,.7); text-shadow:0 0 14px rgba(255,200,110,.6), 0 1px 3px #000; }
.pageno input::placeholder{ color:rgba(240,214,150,.35); font-size:18px; }

.toast{
  bottom:84px; left:50%; transform:translateX(-50%);
  font-family:var(--ui-font); font-weight:600; color:rgba(242,214,146,.95);
  font-size:14px; letter-spacing:3px; opacity:0; pointer-events:none;
  transition:opacity .5s; text-shadow:0 0 10px rgba(255,200,90,.5), 0 1px 3px #000;
  white-space:nowrap;
}
.toast.show{ opacity:1; }
/* above the loading circle and an invitation over it, so what the card says is seen */
.toast{ z-index:37; }

/* the opening: a magic circle draws itself while the book and its film load, then the
   film plays from its first frame and the live book takes over from its last one
   (grimoire.js takeOver) */
#intro{
  position:fixed; inset:0; z-index:35; background:var(--night);
  transition:opacity .9s ease; cursor:default;
}
#intro.gone{ opacity:0; pointer-events:none; }
/* after the whole film its last frame is the live book itself, so the film gives way at
   once, before the camera sets off: a slow fade would show both copies of the page drifting */
#intro.gone.swift{ transition-duration:.2s; }
#intro video{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity .6s ease;
}
#intro.play video{ opacity:1; }
#intro.contain{ background:radial-gradient(120% 60% at 50% 50%, #18200f, var(--night) 70%); }
#intro.contain video{ object-fit:contain; }
#veil{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(70% 55% at 50% 46%, #172019, #0b0f0b 62%, var(--night));
  transition:opacity 1.1s ease;
}
#intro.reveal #veil{ opacity:0; }
#veil .sigil{
  position:relative; width:min(46vmin, 260px); aspect-ratio:1;
  filter:drop-shadow(0 0 5px rgba(255,196,100,.45));
  animation:breathe 4.2s ease-in-out infinite;
  transition:transform 1.4s cubic-bezier(.2,.7,.2,1), filter 1s ease;
}
#veil .sigil svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
/* the ring of runes turns on its own, so the circle lives on while the page is busy */
#veil .sigil .turn{ animation:turn 90s linear infinite; will-change:transform; }
@media (prefers-reduced-motion:reduce){ #veil .sigil .turn{ animation:none; } }
#veil svg .ln{ fill:none; stroke:rgba(236,196,112,.88); stroke-width:.9; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1 1; stroke-dashoffset:1; opacity:0; }
#veil svg .ticks{ fill:none; stroke:rgba(236,196,112,.55); stroke-width:3.2; transition:opacity 1.2s ease; }
#veil svg .core{ fill:rgba(255,226,160,.9); }
#intro.done #veil .sigil{ transform:scale(1.06); filter:drop-shadow(0 0 14px rgba(255,206,120,.85)); }
@keyframes breathe{ 0%,100%{ opacity:.92 } 50%{ opacity:1 } }
@keyframes turn{ to{ transform:rotate(360deg); } }
#veil .name{
  margin-top:clamp(22px, 5vmin, 36px); padding-left:.55em;
  font:600 clamp(13px, 2.4vmin, 17px) var(--ui-font); letter-spacing:.55em; color:#ad9f71;
  text-shadow:0 0 6px rgba(255,214,140,.16); opacity:0; transition:opacity 1.6s ease;
}
#intro.named #veil .name{ opacity:1; }
#veil .mote{
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:rgba(255,230,170,.9); box-shadow:0 0 6px 1px rgba(255,200,110,.7);
  opacity:0; animation:mote 7s ease-in-out infinite;
}
@keyframes mote{
  0%{ opacity:0; transform:translate(0, 0); }
  25%,70%{ opacity:.8; }
  100%{ opacity:0; transform:translate(var(--dx), -90px); }
}
#introNote{
  position:absolute; left:0; right:0; bottom:calc(60px + env(safe-area-inset-bottom)); text-align:center;
  color:rgba(240,214,150,.85); font:600 14px var(--ui-font); letter-spacing:4px; text-shadow:0 1px 4px #000;
}
.film .ui, .film #intro{ display:none !important; }
.film #vignette{ animation:none; opacity:.94; }
#err{
  position:fixed; left:0; right:0; bottom:0; z-index:40; display:none;
  padding:10px 14px; background:rgba(60,10,10,.9); color:#ffd9c9;
  font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; max-height:40%; overflow:auto;
}

.pageno.seeking input{ color:#ffe2a6; text-shadow:0 0 12px rgba(255,200,110,.85); animation:candle 1.2s ease-in-out infinite; }

/* the menu behind the three dots: actions that otherwise live on keys */
.menu{
  top:72px; right:18px; min-width:230px; padding:8px;
  display:flex; flex-direction:column; gap:2px;
  border-radius:18px; border:1px solid transparent;
  background:var(--face) padding-box, var(--gilt) border-box;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  animation:fadein .2s ease-out;
}
.menu[hidden]{ display:none; }
.menu button{
  height:46px; padding:0 16px; border:0; border-radius:11px; background:transparent; text-align:left;
  color:rgba(240,226,192,.92); font:500 18px var(--text-font); cursor:pointer;
}
.menu button:hover, .menu button:focus-visible{ background:rgba(255,210,120,.1); color:#ffe6ae; outline:none; }
.menu button[disabled]{ opacity:.35; pointer-events:none; }
.menu hr{ margin:4px 10px; border:0; border-top:1px solid var(--gold-line); opacity:.6; }
.menu .view{ display:flex; flex-direction:column; gap:2px; }
.menu .two{ display:flex; flex-direction:column; justify-content:center; gap:1px; height:56px; }
.menu .two span{ max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-style:italic; font-size:14px; color:var(--gold-dim); }
.menu .more{ position:relative; padding-right:36px; }
.menu .more::after, .menu .back::before{
  content:''; position:absolute; top:50%; width:7px; height:7px; margin-top:-4px;
  border:solid currentColor; border-width:1.5px 1.5px 0 0; opacity:.6;
}
.menu .more::after{ right:18px; transform:rotate(45deg); }
.menu .back{ position:relative; padding-left:38px; color:var(--gold-dim); font-style:italic; }
.menu .back::before{ left:18px; transform:rotate(-135deg); }
.menu [hidden]{ display:none; }
.menu-note{ max-width:240px; margin:4px 16px 6px; color:var(--gold-dim); font:italic 500 14px var(--text-font); }
@media (pointer:coarse){ .menu .fine{ display:none; } }

@keyframes rise{ from{ opacity:0; transform:translate(-50%, 6px); } to{ opacity:1; transform:translate(-50%, 0); } }

/* the list of spells */
.spells{
  inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:16px;
  background:rgba(5,7,4,.5); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  animation:fadein .35s ease-out;
}
.spells[hidden]{ display:none; }
.spells .card{
  position:relative; width:min(560px, 100%); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow:auto;
  padding:24px 28px 20px; border-radius:18px; border:1px solid transparent;
  background:var(--face) padding-box, var(--gilt) border-box;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
  color:rgba(240,226,192,.92); font-size:17px;
}
.spells h2{ font-family:var(--ui-font); font-weight:700; letter-spacing:5px; color:var(--gold); font-size:17px; text-align:center; text-shadow:0 0 14px rgba(255,190,90,.35); }
.spells .sub{ text-align:center; font-style:italic; color:var(--gold-dim); font-size:15px; margin:2px 0 6px; }
.spells h3{ font-family:var(--ui-font); font-weight:600; letter-spacing:3px; color:var(--gold-dim); font-size:13px; margin:16px 0 4px; text-transform:uppercase; }
.spells .row{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:5px 0; border-bottom:1px dashed rgba(214,164,74,.16); }
.spells .keys{ display:flex; gap:6px; flex-shrink:0; }
.spells kbd{
  font-family:var(--ui-font); font-weight:600; font-size:13px; letter-spacing:1px; color:#ffe2a6;
  padding:2px 9px; border:1px solid var(--gold-line); border-radius:7px; background:rgba(255,210,120,.06); white-space:nowrap;
}
.spells .foot{ margin-top:14px; text-align:center; font-style:italic; color:var(--gold-dim); font-size:15px; }
.spells .close{
  position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%;
  border:1px solid var(--gold-line); background:transparent; color:#e6c47a; font-size:16px; cursor:pointer;
  transition:color .25s, box-shadow .25s;
}
.spells .close:hover{ color:#ffe6ae; box-shadow:0 0 12px rgba(236,192,102,.4); }
/* the shelf of books: one's own and the shared ones */
.shelf .card{ width:min(440px, 100%); }
.shelf h2{ padding:0 34px; }
.shelf .list{ display:flex; flex-direction:column; gap:6px; margin:16px 0 12px; }
.shelf .book{
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:56px;
  padding:8px 16px; border-radius:12px; border:1px solid rgba(214,164,74,.18); background:rgba(255,210,120,.04);
  color:inherit; font:500 18px var(--text-font); text-align:left; cursor:pointer;
}
.shelf .book small{ display:block; margin-top:1px; font-style:italic; font-size:14px; color:var(--gold-dim); }
.shelf .book.on{ border-color:var(--gold-line); background:rgba(255,210,120,.09); }
.shelf .book:hover, .shelf .book:focus-visible{ background:rgba(255,210,120,.1); outline:none; }
.shelf .tick{ color:var(--gold); font-size:18px; }
.shelf .acts{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.shelf .btn{
  min-height:46px; padding:6px 18px; border-radius:23px; border:1px solid var(--gold-line); background:transparent;
  color:#ffe6ae; font:600 17px var(--text-font); cursor:pointer;
}
.shelf .btn.main{ border-color:var(--hairline); background:linear-gradient(180deg, rgba(240,200,120,.14), rgba(240,200,120,.04)); }
.shelf .btn:hover, .shelf .btn:focus-visible{ box-shadow:0 0 12px rgba(236,192,102,.35); outline:none; }
.shelf .btn[disabled]{ opacity:.5; pointer-events:none; }
.shelf .btn.minor{ min-height:36px; border:0; color:var(--gold-dim); font:italic 500 15px var(--text-font); text-decoration:underline; }
.shelf .btn.minor:hover, .shelf .btn.minor:focus-visible{ box-shadow:none; color:var(--gold); }
.shelf input[type=text]{
  width:100%; height:48px; margin-top:14px; padding:0 14px; border-radius:12px; border:1px solid var(--gold-line);
  background:rgba(0,0,0,.25); color:#ffe6ae; font:500 18px var(--text-font); outline:none;
}
.shelf input[type=text]::placeholder{ color:rgba(240,226,192,.4); }
.shelf input[type=text]:focus{ box-shadow:0 0 12px rgba(236,192,102,.3); }
.shelf .linkbox{
  display:flex; align-items:center; gap:8px; min-height:46px; margin:14px 0 4px; padding:4px 4px 4px 16px;
  border-radius:23px; border:1px solid var(--gold-line); background:rgba(0,0,0,.25);
}
.shelf .linkbox .url{
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:15px; color:var(--gold-dim); user-select:all; -webkit-user-select:all;
}
.shelf .linkbox .copy{
  flex:none; min-width:84px; height:38px; padding:0 16px; border-radius:19px; border:1px solid var(--gold-line);
  background:transparent; color:var(--gold); font:600 16px var(--text-font); cursor:pointer;
  transition:border-color .25s, color .25s, background-color .25s;
}
@media (hover:hover){ .shelf .linkbox .copy:hover{ border-color:var(--hairline); color:#ffe6ae; } }
.shelf .linkbox .copy:focus-visible{ outline:1px solid var(--hairline); outline-offset:2px; }
/* the link is in hand: the button says so plainly for a moment */
.shelf .linkbox .copy.done{ border-color:var(--hairline); background:rgba(240,200,120,.1); color:#ffe6ae; }
/* small buttons for what is done to a keeper, to the book, to the account */
.shelf .pill{
  flex:none; min-height:32px; padding:2px 14px; border-radius:16px; border:1px solid rgba(214,164,74,.3);
  background:transparent; color:var(--gold); font:500 15px var(--text-font); cursor:pointer;
}
.shelf .pill:hover, .shelf .pill:focus-visible{ background:rgba(255,210,120,.08); border-color:var(--gold-line); outline:none; }
.shelf .pill.danger{ color:#eaa48c; border-color:rgba(234,164,140,.35); }
.shelf .pill.danger:hover, .shelf .pill.danger:focus-visible{ background:rgba(234,164,140,.08); border-color:rgba(234,164,140,.6); }
/* the open book's name is the title; a tap on it lists the other books */
.shelf .pick{ text-align:center; }
.shelf .pick > summary{ list-style:none; display:inline-flex; align-items:center; gap:10px; cursor:pointer; }
.shelf .pick > summary::-webkit-details-marker, .shelf .more > summary::-webkit-details-marker, .shelf .menu-p > summary::-webkit-details-marker{ display:none; }
.shelf .pick > summary h2{ padding:0; text-transform:uppercase; }
.shelf .pick .list{ text-align:left; margin:14px 0 8px; }
/* the chevron hangs off the title: the summary is padded by its width on the left too, so the words stay centred */
.shelf .pick > summary, .shelf .more > summary{ --chev:10px; --chev-gap:9px; padding-left:calc(var(--chev) + var(--chev-gap)); gap:var(--chev-gap); }
.shelf .pick > summary h2{ margin-right:-5px; }
.shelf .chev{ flex:none; display:block; width:var(--chev, 10px); height:var(--chev, 10px); color:var(--gold-dim); transition:transform .2s; }
.shelf .chev svg{ display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.shelf details[open] > summary .chev{ transform:rotate(180deg); }
.shelf .plus{ position:relative; display:inline-block; width:.62em; height:.62em; margin-right:.32em; }
.shelf .plus::before, .shelf .plus::after{ content:''; position:absolute; left:50%; top:50%; width:100%; height:1.5px; margin:-.75px 0 0 -50%; background:currentColor; border-radius:1px; }
.shelf .plus::after{ transform:rotate(90deg); }
/* people: one Change button each, its choices open under the row */
.shelf .people{ margin-top:8px; }
.shelf .people .row{ position:relative; display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dashed rgba(214,164,74,.16); }
.shelf .people .row:last-child{ border-bottom:0; }
.shelf .people .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:17px; }
.shelf .people .name small{ display:block; font-style:italic; font-size:14px; color:var(--gold-dim); }
.shelf .menu-p{ flex:none; }
.shelf .menu-p > summary{ list-style:none; display:inline-flex; align-items:center; }
.shelf .menu-p[open] > summary{ background:rgba(255,210,120,.08); border-color:var(--gold-line); }
.shelf .opts{ position:absolute; right:0; top:calc(100% - 2px); z-index:3; min-width:220px; display:grid; padding:6px; border-radius:12px; border:1px solid var(--gold-line); background:#23261a; box-shadow:0 8px 24px rgba(0,0,0,.5); }

@keyframes invite{ from{ opacity:0; transform:translateY(18px) rotate(-1.2deg) scale(.97); } to{ opacity:1; transform:none; } }

.shelf.invite .vow .amen{ margin-top:14px; font:600 var(--fs-s) var(--text-font); font-style:normal; letter-spacing:6px; text-transform:uppercase; color:var(--ink); }
.shelf.invite .vow .amen::after{ content:''; display:block; width:150px; height:16px; margin:10px auto 0; background:var(--flourish) center/contain no-repeat; }

.shelf.invite .sign input[type=text], .shelf.invite .sign .name{
  display:block; width:80%; height:auto; margin:0 auto; padding:0 0 2px; border:0; border-bottom:1px solid var(--ink-rule); border-radius:0;
  background:transparent; box-shadow:none; text-align:center; font:400 var(--fs-l)/1.2 'Great Vibes', cursive; color:var(--ink); caret-color:var(--ink);
}

/* the button speaks the book's own button language, the pager's and the Share card's:
   a dark face with rounded ends, one gilt hairline, gold letters. On the pale card it
   is plainly the thing to press. It never grows: the gilt only warms under the pointer */
.shelf.invite .btn.main{
  min-width:min(270px, 100%); min-height:50px; padding:0 36px; border:1px solid var(--hairline); border-radius:999px;
  background:var(--face); color:var(--gold); font:500 var(--fs-m) var(--text-font);
  text-shadow:0 1px 2px rgba(0,0,0,.6); box-shadow:0 4px 10px rgba(40,24,8,.35);
  cursor:pointer; transition:color .25s, box-shadow .25s, transform .08s;
}
.shelf.invite .btn.main:hover, .shelf.invite .btn.main:focus-visible{ color:#ffe6ae; box-shadow:0 0 0 1px rgba(236,192,102,.35), 0 4px 14px rgba(40,24,8,.4); }
.shelf.invite .btn.main:focus-visible{ outline:1px solid rgba(59,38,18,.6); outline-offset:3px; }
.shelf.invite .btn.main:active{ transform:translateY(1px); box-shadow:0 2px 5px rgba(40,24,8,.35); }
/* the card's magic (invite-magic.js): the letters and their light are drawn over the card
   while the text itself waits unseen, and the ornaments follow the words */
.shelf.invite .card canvas.magic{ position:absolute; left:0; top:0; z-index:2; pointer-events:none; }
.shelf.invite .card canvas.magic.glow{ filter:blur(1.5px); mix-blend-mode:screen; }
.shelf.invite .body.ghost *{ color:transparent; text-shadow:none; }
.shelf.invite .body .orn, .shelf.invite .body h2::after, .shelf.invite .body .amen::after, .shelf.invite .body .sign, .shelf.invite .body .acts{ transition:opacity .7s ease, filter .7s ease; }

.shelf.invite .body.leaving .orn, .shelf.invite .body.leaving h2::after, .shelf.invite .body.leaving .acts{ opacity:0; filter:drop-shadow(0 0 6px rgba(255,214,140,.9)); }
.shelf.invite .body.arriving h2::after, .shelf.invite .body.arriving .amen::after, .shelf.invite .body.arriving .sign, .shelf.invite .body.arriving .acts{ opacity:0; }
.shelf.invite .btn.minor{ color:var(--ink); font-size:var(--fs-s); }
.shelf.invite .btn.minor:hover, .shelf.invite .btn.minor:focus-visible{ text-decoration-thickness:2px; }
@media (prefers-reduced-motion:reduce){ .shelf.invite .card{ animation:none; } }
@media (max-width:420px){
  .shelf.invite .card{ padding:30px 34px 40px; aspect-ratio:358/570; }

  .shelf.invite .btn.main{ padding:0 18px; white-space:nowrap; }
}
@media (max-width:420px){ .shelf h2{ padding:0 24px; letter-spacing:2px; font-size:16px; } .shelf .pick > summary h2{ margin-right:-2px; } .shelf .card{ padding:22px 20px 18px; } }
@keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }

@media (max-width:640px){
  .bar{ top:12px; right:12px; gap:7px; }
  .rune{ width:40px; height:40px; font-size:18px; }
  .pager{ bottom:12px; }
  .menu{ top:62px; right:12px; }
}

<body>
<div id="intro" aria-hidden="true">
  <video muted playsinline preload="none" disablepictureinpicture disableremoteplayback></video>
  <div id="veil">
    <div class="sigil">
      <svg class="turn" viewBox="-100 -100 200 200"><circle class="ticks" r="86" pathLength="84" stroke-dasharray=".18 2.82" opacity="0"/></svg>
      <svg class="draw" viewBox="-100 -100 200 200">
        <circle class="ln" r="92" pathLength="1" transform="rotate(-90)"/>
        <circle class="ln" r="80" pathLength="1" transform="rotate(-90)"/>
        <g class="star"></g>
        <circle class="ln" r="30" pathLength="1" transform="rotate(-90)"/>
        <circle class="core" r="1.6" opacity=".35"/>
      </svg>
    </div>
    <div class="name">LIBER ARCANUM</div>
    <p id="introNote"></p>
  </div>
</div>
<script>
/* the opening. A magic circle draws itself as the book's files and the film arrive;
   when the book is ready and the whole film is in hand, the circle flares, the veil
   lifts off the film's first frame and the film plays undisturbed (nothing else
   loads or draws meanwhile). At its last frame the live book takes over.
   On a slow line the film watches its own download and falls back to a lighter cut;
   if even that is not in soon after the book, there is no film: the veil lifts
   straight onto the live book, which opens itself. A tap or a key skips the film */
(()=>{
  const box = document.getElementById('intro');
  if(/[?&]film\b/.test(location.search)){ document.documentElement.classList.add('film'); box.remove(); return; }
  const v = box.querySelector('video'), svg = box.querySelector('svg.draw');
  const ticks = box.querySelector('.ticks'), core = svg.querySelector('.core');
  /* the seven-pointed star of the book's watermark: its seven strokes grow together
     from both ends, so its points come up first and the strokes close in the middle */
  const V = [...Array(7)].map((_, k)=>{ const a = -Math.PI/2 + k*2*Math.PI/7; return [78*Math.cos(a), 78*Math.sin(a)]; });
  const star = svg.querySelector('.star');
  V.forEach((p, k)=>{
    const q = V[(k + 3)%7], l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    [['x1', p[0]], ['y1', p[1]], ['x2', q[0]], ['y2', q[1]]].forEach(([n, x])=>l.setAttribute(n, x.toFixed(2)));
    l.setAttribute('class', 'ln'); l.setAttribute('pathLength', '1');
    star.appendChild(l);
  });
  const [outer, inner, ...rest] = [...svg.querySelectorAll('.ln')], small = rest.pop();
  /* the outer ring, the inner one, the star, the small ring at its heart: one after another */
  const PARTS = [[outer, 0, .22], [inner, .2, .4], ...rest.map(l=>[l, .4, .82]), [small, .82, 1]];
  const draw = p=>{
    PARTS.forEach(([l, a, b])=>{
      const f = Math.min(1, Math.max(0, (p - a)/(b - a)));
      if(l.tagName === 'line'){ l.style.strokeDasharray = `${f/2} ${1 - f} ${f/2}`; l.style.strokeDashoffset = 0; }
      else l.style.strokeDashoffset = 1 - f;
      l.style.opacity = f > 0.002 ? 1 : 0;
    });
    ticks.setAttribute('opacity', Math.min(1, Math.max(0, (p - .1)/.2)).toFixed(2));
    core.setAttribute('opacity', (.35 + .65*p).toFixed(2));
  };
  /* what has arrived sets a goal and the drawing eases toward it, so a big file landing
     never makes it leap; while nothing arrives (the page building the forest) it keeps
     creeping a little way on, slower the further it gets ahead */
  let goal = 0, shown = 0, rush = false, prev = performance.now();
  const aim = p=>{ goal = Math.max(goal, Math.min(1, p)); };
  const step = now=>{
    const dt = Math.min(0.1, (now - prev)/1000);
    prev = now;
    const to = rush ? 1 : shown < goal ? goal : Math.min(.97, goal + .1);
    const k = rush ? 7 : shown < goal ? 2.2 : 0.06;
    shown += (to - shown)*(1 - Math.exp(-k*dt));
    if(rush && shown > .995) shown = 1;
    draw(shown);
    if(!I.gone && shown < 1) requestAnimationFrame(step);
  };
  for(let i=0;i<7;i++){
    const m = document.createElement('i');
    m.className = 'mote';
    m.style.cssText = `left:${30 + Math.random()*40}%;top:${42 + Math.random()*22}%;--dx:${(Math.random() - .5)*60}px;animation-delay:${(i*1.1 + Math.random()).toFixed(2)}s;animation-duration:${(6 + Math.random()*3).toFixed(2)}s`;
    box.querySelector('#veil').appendChild(m);
  }
  Promise.race([document.fonts.load('600 16px "Cormorant SC"', 'LIBER ARCANUM'), new Promise(r=>setTimeout(r, 1500))])
    .then(()=>box.classList.add('named'), ()=>box.classList.add('named'));

  /* the cuts there are; a tall screen without its own cut sees the wide one whole */
  const CUTS = ['wide', 'tall'], tall = innerWidth/innerHeight < 0.9;
  const kind = tall && CUTS.includes('tall') ? 'tall' : 'wide', fit = tall && kind === 'wide' ? 'contain' : 'cover';
  const I = window.__intro = { kind, fit, take: null, film: null, gone: false };
  /* the book reports how far it has got once its files are in (grimoire.js boot) */
  I.stage = aim;
  draw(0);
  requestAnimationFrame(step);
  box.classList.add(fit);
  const OPENED = 7.3;
  /* what the book itself downloads, roughly, on this kind of device, and the film */
  const EXPECT = matchMedia('(pointer: coarse)').matches ? 35e6 : 54e6;
  const FILM_GUESS = kind === 'tall' ? 3.5e6 : 6.2e6;
  /* how long the film may keep the reader waiting once the book is ready */
  const LATE = 5000;
  let ctl = null, filmGot = 0, filmTotal = FILM_GUESS, noFilm = false, bookAt = 0, playing = false, lastT = -1, lastMove = 0;

  const finish = mode=>{
    if(I.gone) return;
    I.gone = true;
    I.take(mode);
    box.classList.add(...(mode === 'open' ? ['swift', 'gone'] : ['gone']));
    setTimeout(()=>{ v.removeAttribute('src'); v.load(); if(I.film) URL.revokeObjectURL(I.film); box.remove(); }, 1000);
  };
  /* the film has its music, unless the reader turned the sound off; a browser that
     will not let a page sound before it is touched gets the film without it */
  let quiet = false;
  try{ quiet = localStorage.getItem('liber-arcanum.muted') === '1'; }catch(e){}
  const roll = mute=>{
    v.muted = mute;
    const p = v.play();
    if(p && p.catch) p.catch(()=>{ if(!mute) roll(true); else finish('closed'); });
  };
  /* the circle completes and flares, then the veil lifts */
  let lifting = false;
  const lift = ()=>{
    if(lifting || I.gone) return;
    lifting = true;
    rush = true;
    box.classList.add('done');
    if(!I.film || noFilm){ setTimeout(()=>finish('closed'), 700); return; }
    /* the player starts under the veil, so its first steps are never seen */
    v.addEventListener('playing', ()=>setTimeout(()=>box.classList.add('play', 'reveal'), 250), { once: true });
    setTimeout(()=>roll(quiet), 450);
    setTimeout(()=>{ if(!playing) finish('closed'); }, 4000);
  };
  const check = ()=>{
    if(I.gone || lifting || !I.take || I.holding) return;
    if(noFilm) return lift();
    if(I.film && v.readyState >= 2) return lift();
    if(performance.now() - bookAt > LATE){ noFilm = true; if(ctl) ctl.abort(); lift(); }
  };
  I.ready = take=>{ I.take = take; bookAt = performance.now(); check(); };
  /* an invitation is read over the circle first; the film waits until it is done */
  I.wait = p=>{ I.holding = true; p.then(()=>{ I.holding = false; bookAt = performance.now(); check(); }); };

  setInterval(()=>{
    if(I.gone || lifting) return;
    let got = 0;
    for(const e of performance.getEntriesByType('resource')) if(!/assets\/intro\//.test(e.name)) got += e.encodedBodySize || e.transferSize || 0;
    const film = noFilm ? 0 : filmTotal;
    aim(.8*Math.min(1, (got + (noFilm ? 0 : filmGot))/(EXPECT + film)));
    check();
  }, 300);

  v.addEventListener('playing', ()=>{ playing = true; lastMove = performance.now(); try{ localStorage.setItem(SEEN, '1'); }catch(e){} });
  v.addEventListener('timeupdate', ()=>{ if(v.currentTime !== lastT){ lastT = v.currentTime; lastMove = performance.now(); } });
  v.addEventListener('ended', ()=>finish('open'));
  v.addEventListener('error', ()=>{ if(!lifting){ noFilm = true; check(); } else finish('closed'); });
  v.addEventListener('loadeddata', check);
  /* a film that stops moving for good hands over to the book */
  setInterval(()=>{
    if(playing && !I.gone && performance.now() - lastMove > 3000) finish(v.currentTime > OPENED ? 'open' : 'closed');
  }, 500);

  /* the film comes down whole before it plays, so it never waits on the line */
  const fetchCut = async cut=>{
    ctl = new AbortController();
    const res = await fetch('assets/intro/' + kind + cut + '.mp4?v=6', { signal: ctl.signal });
    if(!res.ok) throw new Error(res.status);
    filmTotal = +res.headers.get('content-length') || filmTotal;
    filmGot = 0;
    const t0 = performance.now(), parts = [], rd = res.body.getReader();
    for(;;){
      const { done, value } = await rd.read();
      if(done) break;
      parts.push(value);
      filmGot += value.length;
      const el = (performance.now() - t0)/1000;
      /* at this pace the full cut would take too long: the lighter one instead */
      if(cut === '' && el > 2.5 && (filmTotal - filmGot)/(filmGot/el) > 9){ ctl.abort(); return fetchCut('_lite'); }
    }
    return new Blob(parts, { type: 'video/mp4' });
  };
  /* the film plays on the first visit only; ?intro shows it again */
  const SEEN = 'liber-arcanum.film-seen';
  let seen = false;
  try{ seen = !!localStorage.getItem(SEEN); }catch(e){}
  if(/[?&]intro\b/.test(location.search)){
    seen = false;
    const u = new URL(location.href);
    u.searchParams.delete('intro');
    history.replaceState(null, '', u);
  }
  /* an invitation always ends in the film, seen before or not: the vow opens the book.
     The invitation is in the address, or kept for this tab across a sign-in */
  let invited = /^#join=[A-Za-z0-9]{6,40}\.[a-z0-9]{24,64}/.test(location.hash);
  try{ invited = invited || !!sessionStorage.getItem('liber-arcanum.join'); }catch(e){}
  if(invited) seen = false;
  if(seen || matchMedia('(prefers-reduced-motion: reduce)').matches || (navigator.connection && navigator.connection.saveData)) noFilm = true;
  else fetchCut('').then(blob=>{
    if(noFilm || I.gone) return;
    I.film = URL.createObjectURL(blob);
    v.preload = 'auto';
    v.src = I.film;
    v.load();
  }).catch(()=>{ noFilm = true; check(); });

  const skip = ()=>{ if(playing && !I.gone) finish(v.currentTime > OPENED ? 'open' : 'closed'); };
  box.addEventListener('pointerdown', skip);
  /* keys belong to the opening, except those typed into an invitation shown over it */
  addEventListener('keydown', e=>{ if(!I.gone && !e.metaKey && !e.ctrlKey && !(I.holding && e.target.closest && e.target.closest('#shelf'))){ e.stopPropagation(); skip(); } }, true);
})();
</script>

  <button class="rune" id="btnBook" title="Open the book (O)" aria-label="Open the book"><svg class="ico-open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 6.6C9.8 5 6.9 4.5 3.2 5v13.2c3.7-.5 6.6 0 8.8 1.6 2.2-1.6 5.1-2.1 8.8-1.6V5c-3.7-.5-6.6 0-8.8 1.6z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path d="M12 6.6v13.2" stroke="currentColor" stroke-width="1.2"/><path d="M5.6 8.6c1.8-.2 3.4.1 4.6.8M5.6 11.4c1.8-.2 3.4.1 4.6.8M18.4 8.6c-1.8-.2-3.4.1-4.6.8M18.4 11.4c-1.8-.2-3.4.1-4.6.8" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" opacity=".75"/></svg><svg class="ico-close" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="5.5" y="3.2" width="13.5" height="17.6" rx="1.6" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8.3 3.2v17.6" stroke="currentColor" stroke-width="1.2"/><circle cx="13.6" cy="10.4" r="1.7" fill="currentColor"/><path d="M13.6 6.6v1.6M13.6 12.6v1.6M10.6 10.4h1.4M15.6 10.4h1.4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg></button>
  <button class="rune" id="btnWrite" title="Lay the book open and write" aria-label="Lay the book open and write"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20.5 2.5c-6 1-11 5.5-13.2 12.3l-1.6 4.9 1.4.5 1.2-3.3c3.6-.4 6.6-2.3 8.4-5.3-1.4.3-2.7.2-3.9-.2 2.6-.6 4.6-2.1 5.9-4.3-1 .1-1.9 0-2.8-.3 2-.9 3.6-2.4 4.6-4.3z" fill="currentColor"/><path d="M4.2 21.5c1.8-.4 3.5-.2 5 .4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg></button>
  <button class="rune" id="btnMore" title="More" aria-label="More actions" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor"/></svg></button>
</div>

<div class="ui menu" id="menu" role="menu" hidden>
  <div class="view" data-view="main">
    <button role="menuitem" data-act="share" class="two" hidden>Share<span>Send the book to a friend</span></button>
    <button role="menuitem" data-act="erase" hidden>Erase this page</button>
    <button role="menuitem" data-act="erase2" hidden>Erase this page</button>
    <button role="menuitem" data-act="restore" hidden>Undo erase</button>
    <button role="menuitem" data-act="files" class="two more">Files<span>Download or restore the book</span></button>
    <button role="menuitem" data-act="replay">Intro</button>
    <button role="menuitem" data-act="spells" class="fine">Shortcuts</button>
  </div>
  <div class="view" data-view="files" hidden>
    <button role="menuitem" data-act="main" class="back">Files</button>
    <button role="menuitem" data-act="exportText" class="two">Download as text<span>To read or print anywhere</span></button>
    <button role="menuitem" data-act="saveCopy" class="two">Download a backup<span>Everything, to restore later</span></button>
    <button role="menuitem" data-act="openCopy" class="two">Restore a backup<span>Replaces your private book</span></button>
  </div>
  <hr>
  <p class="menu-note">Saves automatically</p>
</div>

<nav class="ui pager" id="pager" aria-label="Pages" hidden>
  <i class="fillet under"></i><i class="fillet line"></i>
  <button id="btnPrev" title="Previous page (←)" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4C12.6 7.8 10 10.4 7 12c3 1.6 5.6 4.2 8.5 8-1.6-3.6-3-6.1-4.6-8 1.6-1.9 3-4.4 4.6-8z"/></svg></button>
  <label class="pageno" id="pageNo" title="Type a page number (G)"><input id="pageIn" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off" spellcheck="false" placeholder="page" aria-label="Page number, type one and press Go"><span>of 100</span></label>
  <button id="btnNext" title="Next page (→)" aria-label="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4c2.9 3.8 5.5 6.4 8.5 8-3 1.6-5.6 4.2-8.5 8 1.6-3.6 3-6.1 4.6-8-1.6-1.9-3-4.4-4.6-8z"/></svg></button>
</nav>


<pre id="err"></pre>

<script>
window.addEventListener('error', e=>{
  const p = document.getElementById('err');
  p.style.display = 'block';
  p.textContent += (e.message || e) + '\n';
});
window.addEventListener('unhandledrejection', e=>{
  const p = document.getElementById('err');
  p.style.display = 'block';
  p.textContent += 'Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n';
});
</script>
<script type="module" src="./grimoire.js?v=108"></script>
