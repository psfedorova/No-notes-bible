<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liber Arcanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600;700&family=Fondamento&family=Ponomar&family=Triodion&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
:root{
  --gold:#f0d493;
  --gold-dim:rgba(240,214,150,.66);
  --gold-line:rgba(214,164,74,.45);
  --night:#080a07;
  --ui-font:'Cormorant SC','Cormorant Garamond',serif;
  --text-font:'Cormorant Garamond',serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow:hidden; background:var(--night); }
body{
  font-family:var(--text-font);
  user-select:none; -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
}
body.grabbing{ cursor:grabbing; }
body.cur-turn{ cursor:grab; }
body.cur-text{ cursor:text; }
body.cur-pointer{ cursor:pointer; }

#gl{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }

#vignette{
  position:fixed; inset:0; pointer-events:none; z-index:5;
  background: radial-gradient(125% 95% at 50% 46%, transparent 58%, rgba(9,7,3,.36) 100%);
  animation: candle 6s ease-in-out infinite;
}
@keyframes candle{
  0%,100%{ opacity:1 } 23%{ opacity:.9 } 41%{ opacity:.97 } 67%{ opacity:.87 } 82%{ opacity:.96 }
}

/* the real keyboard target: the ink itself is painted into the page texture */
#quill{
  position:fixed; left:0; bottom:0; z-index:0;
  width:2400px; height:24px;
  opacity:0; pointer-events:none;
  font-size:16px; line-height:24px;
  border:0; outline:none; resize:none; overflow:hidden;
  white-space:pre; background:transparent; color:transparent; caret-color:transparent;
}

.ui{ position:fixed; z-index:10; }
.hint{
  bottom:20px; left:50%; transform:translateX(-50%);
  width:max-content; max-width:calc(100vw - 32px);
  font-family:var(--text-font); font-style:italic; font-weight:500;
  color:var(--gold-dim); font-size:16px; letter-spacing:.4px;
  text-align:center; pointer-events:none; transition:opacity .8s;
  text-shadow:0 1px 4px #000, 0 0 18px rgba(0,0,0,.7);
}
.bar{ top:18px; right:18px; display:flex; gap:10px; }
.rune{
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--gold-line);
  background:radial-gradient(circle at 35% 30%, rgba(92,98,50,.55), rgba(16,16,10,.9));
  color:var(--gold); font-size:20px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-family:var(--ui-font);
  box-shadow: 0 2px 10px rgba(0,0,0,.7), inset 0 0 12px rgba(255,206,110,.14);
  transition:transform .25s, box-shadow .25s, opacity .25s;
}
.rune:hover, .rune:focus-visible{
  box-shadow: 0 2px 14px rgba(0,0,0,.8), inset 0 0 16px rgba(255,206,110,.34), 0 0 18px rgba(236,192,102,.42);
  transform:translateY(-2px); outline:none;
}
.rune.on{ box-shadow: 0 0 0 1px rgba(240,212,147,.7), inset 0 0 18px rgba(255,206,110,.45), 0 0 18px rgba(236,192,102,.45); }
.rune[disabled]{ opacity:.35; pointer-events:none; }
.rune[hidden]{ display:none; }
#btnSound .ico-off, #btnSound.muted .ico-on{ display:none; }
#btnSound.muted .ico-off{ display:block; }
#btnSound.muted{ opacity:.62; }

.nav{ top:50%; transform:translateY(-50%); width:50px; height:50px; font-size:22px; }
.nav.prev{ left:18px; }
.nav.next{ right:18px; }
.nav:hover{ transform:translateY(calc(-50% - 2px)); }

.pageno{
  top:24px; left:50%; transform:translateX(-50%);
  font-family:var(--ui-font); font-weight:600; color:var(--gold-dim);
  font-size:15px; letter-spacing:3px; pointer-events:none;
  text-shadow:0 1px 4px #000; transition:opacity .5s;
}

.toast{
  bottom:56px; left:50%; transform:translateX(-50%);
  font-family:var(--ui-font); font-weight:600; color:rgba(242,214,146,.95);
  font-size:14px; letter-spacing:3px; opacity:0; pointer-events:none;
  transition:opacity .5s; text-shadow:0 0 10px rgba(255,200,90,.5), 0 1px 3px #000;
  white-space:nowrap;
}
.toast.show{ opacity:1; }

#loading{
  position:fixed; inset:0; z-index:20; display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:radial-gradient(120% 100% at 50% 40%, #1d2417, #070a06 75%);
  color:rgba(240,214,150,.8); font-family:var(--ui-font); font-weight:600;
  letter-spacing:4px; font-size:15px;
  transition:opacity 1.1s ease; pointer-events:none;
}
#loading.gone{ opacity:0; }
#loading .sig{ font-size:30px; color:rgba(232,192,105,.9); text-shadow:0 0 22px rgba(255,190,90,.5); animation:candle 3.4s ease-in-out infinite; }
#err{
  position:fixed; left:0; right:0; bottom:0; z-index:40; display:none;
  padding:10px 14px; background:rgba(60,10,10,.9); color:#ffd9c9;
  font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; max-height:40%; overflow:auto;
}

.pageno{ pointer-events:auto; cursor:pointer; padding:4px 10px; }
.pageno:hover{ color:var(--gold); }
.pageno.seeking{ color:#ffe2a6; text-shadow:0 0 12px rgba(255,200,110,.85), 0 1px 4px #000; animation:candle 1.2s ease-in-out infinite; }

/* turn to a page: a small gilt seal under the page number */
.seek{
  top:58px; left:50%; transform:translateX(-50%);
  display:flex; align-items:baseline; gap:12px; padding:10px 22px 12px;
  border-radius:30px; border:1px solid var(--gold-line);
  background:radial-gradient(120% 140% at 50% 0%, rgba(58,62,34,.92), rgba(14,15,9,.94));
  box-shadow:0 6px 24px rgba(0,0,0,.6), inset 0 0 18px rgba(255,206,110,.12), 0 0 26px rgba(236,192,102,.18);
  font-family:var(--ui-font); font-weight:600; color:var(--gold-dim); letter-spacing:2.5px; font-size:14px;
  animation:rise .45s ease-out;
}
.seek[hidden]{ display:none; }
.seek input{
  width:3.4ch; background:transparent; border:0; border-bottom:1px solid var(--gold-line);
  color:#ffe6ae; font:600 24px var(--ui-font); text-align:center; outline:none; caret-color:var(--gold);
  text-shadow:0 0 12px rgba(255,200,110,.6); user-select:text; -webkit-user-select:text;
}
@keyframes rise{ from{ opacity:0; transform:translate(-50%, -6px); } to{ opacity:1; transform:translate(-50%, 0); } }

/* the list of spells */
.spells{
  inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:16px;
  background:rgba(5,7,4,.5); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  animation:fadein .35s ease-out;
}
.spells[hidden]{ display:none; }
.spells .card{
  position:relative; width:min(560px, 100%); max-height:calc(100vh - 32px); overflow:auto;
  padding:24px 28px 20px; border-radius:16px; border:1px solid var(--gold-line);
  background:radial-gradient(130% 110% at 50% 0%, rgba(48,52,28,.96), rgba(12,13,8,.97));
  box-shadow:0 10px 40px rgba(0,0,0,.7), inset 0 0 30px rgba(255,206,110,.08);
  color:rgba(240,226,192,.92); font-size:17px;
}
.spells h2{ font-family:var(--ui-font); font-weight:700; letter-spacing:5px; color:var(--gold); font-size:17px; text-align:center; text-shadow:0 0 14px rgba(255,190,90,.35); }
.spells .sub{ text-align:center; font-style:italic; color:var(--gold-dim); font-size:15px; margin:2px 0 6px; }
.spells h3{ font-family:var(--ui-font); font-weight:600; letter-spacing:3px; color:var(--gold-dim); font-size:13px; margin:16px 0 4px; text-transform:uppercase; }
.spells .row{ display:flex; justify-content:space-between; align-items:center; gap:16px; padding:5px 0; border-bottom:1px dashed rgba(214,164,74,.16); }
.spells .keys{ display:flex; gap:6px; flex-shrink:0; }
.spells kbd{
  font-family:var(--ui-font); font-weight:600; font-size:13px; letter-spacing:1px; color:#ffe2a6;
  padding:2px 9px; border:1px solid var(--gold-line); border-radius:7px; background:rgba(255,210,120,.06); white-space:nowrap;
}
.spells .foot{ margin-top:14px; text-align:center; font-style:italic; color:var(--gold-dim); font-size:15px; }
.spells .close{
  position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%;
  border:1px solid var(--gold-line); background:transparent; color:var(--gold); font-size:16px; cursor:pointer;
}
.spells .close:hover{ box-shadow:0 0 12px rgba(236,192,102,.4); }
@keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }

@media (max-width:640px){
  .bar{ top:12px; right:12px; gap:7px; }
  .rune{ width:40px; height:40px; font-size:18px; }
  .nav{ top:auto; bottom:64px; transform:none; width:44px; height:44px; }
  .nav:hover{ transform:translateY(-2px); }
  .nav.prev{ left:16px; } .nav.next{ right:16px; }
  .pageno{ top:auto; bottom:78px; }
  .hint{ font-size:14px; bottom:16px; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vignette"></div>
<textarea id="quill" spellcheck="false" autocomplete="off" autocapitalize="sentences" aria-label="Page text"></textarea>

<div class="ui hint" id="hint"></div>
<div class="ui toast" id="toast"></div>
<div class="ui pageno" id="pageNo" title="Turn to a page (G)"></div>
<div class="ui seek" id="seek" hidden><label for="seekIn">TURN TO PAGE</label><input id="seekIn" inputmode="numeric" maxlength="3" autocomplete="off" spellcheck="false" aria-label="Page number"><span>OF 100</span></div>
<div class="ui spells" id="spells" hidden><div class="card" role="dialog" aria-label="Shortcuts"><button class="close" aria-label="Close">✕</button><h2>SPELLS OF THE TOME</h2><p class="sub">keyboard shortcuts</p></div></div>

<div class="ui bar">
  <button class="rune" id="btnSound" title="Sound on (M)" aria-label="Forest sound" aria-pressed="true"><svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5h3.2L12 5.2v13.6l-4.8-4.3H4z" fill="currentColor"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6M17.8 6.6a7.6 7.6 0 0 1 0 10.8" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg><svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5h3.2L12 5.2v13.6l-4.8-4.3H4z" fill="currentColor"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>
  <button class="rune" id="btnWrite" title="Lay the book open and write" aria-label="Lay the book open and write"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20.5 2.5c-6 1-11 5.5-13.2 12.3l-1.6 4.9 1.4.5 1.2-3.3c3.6-.4 6.6-2.3 8.4-5.3-1.4.3-2.7.2-3.9-.2 2.6-.6 4.6-2.1 5.9-4.3-1 .1-1.9 0-2.8-.3 2-.9 3.6-2.4 4.6-4.3z" fill="currentColor"/><path d="M4.2 21.5c1.8-.4 3.5-.2 5 .4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg></button>
</div>

<button class="ui rune nav prev" id="btnPrev" title="Previous page" aria-label="Previous page">❮</button>
<button class="ui rune nav next" id="btnNext" title="Next page" aria-label="Next page">❯</button>


<div id="loading"><div class="sig">✦</div><div>KINDLING THE TOME</div></div>
<pre id="err"></pre>

<script>
window.addEventListener('error', e=>{
  const p = document.getElementById('err');
  p.style.display = 'block';
  p.textContent += (e.message || e) + '\n';
});
window.addEventListener('unhandledrejection', e=>{
  const p = document.getElementById('err');
  p.style.display = 'block';
  p.textContent += 'Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n';
});
</script>
<script type="module" src="./grimoire.js?v=47"></script>
</body>
</html>
